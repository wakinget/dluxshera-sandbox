system:
  preset: SHERA_FLIGHT_3P
  source:
    target: ALPHA_CEN
    exposure_time_s: 0.05

experiment:
  kind: subblock_generation
  seed: 42
  notes: "Observation sub-block generation template."

  subblock:
    # Applied keys - authoritative subset of keys to vary, even if the trace contains more time-varying parameters
    varying_keys:
      - source.x_position_as
      - source.y_position_as
      - source.position_angle_deg
    trace:
      format: csv  # currently supported trace format
      # Canonical CSV can be generated by subblock_trace_generation.py.
      # Relative paths are resolved from this prescription file's directory.
      path: frame_truth.csv
    validate:
      # Defaults are true; set false to relax each check.
      require_contiguous_frame_index: true
      require_monotonic_time: true

  noise:
    enabled: false
    photon_noise: true
    read_noise: false
    dark_current: false

  outputs:
    # Relative paths are resolved from this prescription file's directory.
    outdir: ../../../Results/obs_subblocks
    file_prefix: obs_subblock
    frame_truth_format: csv
