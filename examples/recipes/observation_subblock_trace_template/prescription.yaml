system:
  preset: SHERA_TESTBED_3P
  source:
    n_lambda: 1
  detector:
    layers:
      - name: downsample
        kind: Downsample
        kernel_size: 3

experiment:
  kind: observation_subblock_trace
  seed: 42
  notes: "Phase 4 generalized trace-builder template (3 frames)."

  truth:
    source:
      exposure_time_s: 0.05

  observation_subblock_trace:
    n_frames: 3
    dt_s: 0.05
    varying_keys:
      - source.x_position_as
      - source.y_position_as
      - optics.plate_scale_as_per_pix
      - optics.primary.zernike_coeffs_nm[2]
    trace_plan:
      source.x_position_as:
        # base omitted: anchor comes from resolved/refreshed nominal store value.
        effects:
          - kind: linear_drift
            start: 0.000
            rate_per_s: 0.100
          - kind: iid_jitter
            center: 0.000
            sigma: 0.002
      source.y_position_as:
        # explicit base has highest anchor precedence.
        base: 0.000
        effects:
          - kind: random_walk
            start: 0.000
            sigma_step: 0.001
      optics.plate_scale_as_per_pix:
        # derived key anchor omitted: resolved from refreshed nominal store.
        effects:
          - kind: constant_offset
            offset: 0.0002
      optics.primary.zernike_coeffs_nm[2]:
        base: 1.500
        effects:
          - kind: iid_jitter
            center: 0.000
            sigma: 0.050

  outputs:
    outdir: Results/observation_subblock_trace
    file_prefix: obs_subblock_trace
    write_manifest: true
