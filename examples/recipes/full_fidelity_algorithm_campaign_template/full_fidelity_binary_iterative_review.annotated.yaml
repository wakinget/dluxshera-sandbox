# Annotated companion for full_fidelity_binary_iterative_review.yaml.
# Valid string options are centrally documented in:
#   full_fidelity_binary_iterative_review_config_reference.md/json
# Implemented-status vocabulary: implemented, accepted_but_noop, smoke_only,
# future_placeholder, deprecated, unknown_should_fail.
#
# Key contract notes:
# - experiment.kind valid executable values: full_fidelity_binary_iterative and
#   observation_bias_campaign. Deprecated review/smoke aliases are normalized
#   for compatibility only. The future
#   full_fidelity_algorithm_campaign skeleton remains non-executable.
# - spectral_model.fast is smoke_only and intentionally absent here.
# - photometry_mode implemented value: preserve_detected_flux_parameters.
#   log_flux_total and contrast remain detected, post-response, band-integrated
#   scalar parameters; throughput/SED changes normalized spectral weights and
#   records flux factors in provenance.
# - out_of_band_response implemented value: zero. edge_hold/extrapolate/error are
#   future placeholders.
# - response component mode implemented value for inference: same_as_truth.
# - high_order_wfe.inference.mode implemented value: knowledge_error, meaning
#   reference high-order map = truth high-order map + additive correlated error.
# - knowledge_error.remove_low_order_zernikes=true removes configured low-order
#   Zernike projections from the additive error to avoid double-counting low-order
#   WFE uncertainty.
# - subblocks.noise is structured here, but currently translates to legacy
#   --noise enabled/disabled plus provenance; separate shot/read/dark controls are
#   not yet exposed by the subblock runner.
# - trace_source.source.kind implemented values: airbus_csv and csv with
#   format=airbus_xyz_arcsec.
# - trajectory high-pass production filtering is future/deferred; notebook-only
#   diagnostics are separate.
# - trace_jitter.apply_to=downstream_template_override is current behavior: it is
#   not added to the materialized trajectory CSV.
# - SHERA_FLIGHT_3P_CONV supplies detector realism layers. Named overrides keep
#   jitter near identity and patch/remove the existing smear layer by policy.
# - observation_theta Zernike indices are array indices into the resolved system
#   coefficient vector. For SHERA_FLIGHT_3P_CONV, array index 0 maps to Noll Z4.
# - prior_draws sigma kind implemented values: absolute and fractional.
experiment:
  kind: full_fidelity_binary_iterative
  schema_version: full_fidelity_binary_iterative.v1
  run_name: full_fidelity_binary_iterative_review
  seed: 42
  source_kind: binary_target
  target: ALPHA_CEN
  n_cases: 1
  system_preset: SHERA_FLIGHT_3P_CONV

  detector_overrides:
    layers:
      jitter:
        action: update
        kernel:
          sigma_x: 0.001
          sigma_y: 0.001
          theta_deg: 0.0
          kernel_size: 3
          units: detector_pix

  spectral_model:
    enabled: true
    preserve_flux_parameters: true
    photometry_mode: preserve_detected_flux_parameters
    source_seds:
      mode: target
      generic_binary_fallback: alpha_cen
    truth:
      label: truth_review_alpha_cen
      mode: effective_source_spectrum
      n_lambda: 31
      wavelength_min_nm: 350.0
      wavelength_max_nm: 850.0
      components:
        detector_qe:
          enabled: true
          path: data/detector_qe/LTN4323_QE.csv
          label: LTN4323_QE_proxy_for_HWK4123
          wavelength_column: Wavelength (nm)
          wavelength_unit: nm
          response_column: QE
          response_unit: dimensionless
          response_scale: 1.0
          detector_model_proxy_for: HWK4123
          assumption: LTN4323 QE curve used as near-term proxy for HWK4123 detector QE.
        m2_filter_response:
          enabled: true
          path: data/filter_response/SHERA Notch Filter V2.csv
          label: SHERA_Notch_Filter_V2_reflectance
          wavelength_column: Wavelength (nm)
          wavelength_unit: nm
          response_column: R (%)
          response_unit: percent_reflection
          response_scale: 0.01
    inference:
      label: inference_review_alpha_cen
      mode: truncated_effective_source_spectrum
      n_lambda: 7
      wavelength_min_nm: 350.0
      wavelength_max_nm: 850.0
      out_of_band_response: zero
      renormalize_weights: true
      components:
        detector_qe:
          mode: same_as_truth
        m2_filter_response:
          mode: same_as_truth

  high_order_wfe:
    enabled: true
    truth:
      enabled: true
      mirrors: [primary, secondary]
      mode: synthetic
      npix: 128
      amplitude_nm_rms: 20.0
      power_law_alpha: 2.5
      seed: 20260610
      pairing: independent
      remove_low_order_zernikes: true
      remove_zernike_modes: [4, 5, 6, 7, 8, 9, 10, 11]
    inference:
      enabled: true
      mode: knowledge_error
      use_truth_common_map: true
      knowledge_error:
        enabled: true
        amplitude_nm_rms: 0.3
        power_law_alpha: same_as_truth
        remove_low_order_zernikes: true
        realization_policy: additive_correlated
    artifacts:
      write_maps: true
      write_png_quicklooks: false
      write_summary_json: true
    validation:
      require_nonzero_difference_when_enabled: true
      max_abs_low_order_projection_nm: 1.0e-6
      fail_on_low_order_projection: true

  subblocks:
    n_subblocks: 2
    n_frames: 5
    noise:
      enabled: true
      shot_noise: true
      read_noise: true
      dark_current: false
      use_detector_read_noise: true
      read_noise_electrons: null
      use_detector_dark_current: true
      dark_current_e_per_s: null
      variance_floor: 1.0
      write_variance: true
      seed_policy: from_subblock_noise_seed
    use_render_variance: auto
    phi_ref: truth_when_available
    schur_curvature_method: auto
    max_dense_dim: 80
    schur_damping: 1.0e-8
    exposure_time_s: 0.05
    reference_diagnostics_profile: review
    reference_optimizer_kind: sgd
    reference_base_lr: 0.4
    reference_n_iter: 80
    reference_schedule_kind: linear_warmup
    reference_schedule_warmup_steps: 10
    reference_schedule_start_factor: 0.125
    reference_early_stopping_enabled: true
    reference_early_stopping_min_iter: 20
    reference_early_stopping_patience: 10
    reference_early_stopping_loss_rtol: null
    reference_early_stopping_loss_atol: null
    reference_early_stopping_step_atol: null
    reference_early_stopping_grad_norm_atol: null
    variance_floor: 1.0
    summary_information_scale: summed_likelihood
    schur_frame_quality_policy: warn
    schur_frame_quality_missing: allow_all
    schur_frame_mask_denominator: original
    trace_source:
      mode: trajectory
      source:
        kind: csv
        format: airbus_xyz_arcsec
        path: src/dluxshera/data/airbus_data/Thirty_Min_Observation_Window.csv
      window:
        start_s: 60.0
      sampling:
        interpolation: linear
    trajectory_processing:
      high_pass:
        enabled: false
        timescale_s: 15.0
        method: none
        note: Production high-pass filtering is deferred; notebook diagnostic is separate.
      smear:
        enabled: true
        render:
          mode: subblock_constant_layer
          target_layer: smear
        inference:
          mode: matched_subblock_constant
    trace_jitter:
      enabled: true
      apply_to: downstream_template_override
      x_sigma_as: 1.0e-3
      y_sigma_as: 1.0e-3
      pa_sigma_deg: 1.0e-4

  iterative:
    enabled: true
    windows_per_draw: 2
    subblocks_per_window: 1
    update_mode: physical_full
    update_gain: 0.25
    carry_prior_mean_with_reference: true
    update_safety:
      enabled: true
      posterior_sigma_policy: reported_only
      min_sigma_by_label: null
      process_noise_by_label: null
      max_abs_update_by_label: null
      reject_on_bad_frame_quality: true
      reject_on_nonfinite_posterior: true

  seeding:
    seed_policy: different_jitter_different_noise
    base_seed: 42

  observation_theta:
    source:
      separation_as: true
      log_flux_total: true
      contrast: true
    optics:
      plate_scale_as_per_pix: true
      primary_zernikes:
        enabled: true
        indices: from_system
      secondary_zernikes:
        enabled: true
        indices: from_system

  prior_draws:
    enabled: true
    n_cases: 1
    center: truth
    distribution: normal
    draw_seed: 12345
    case_name_template: full_fidelity_review_draw_{draw_index:03d}
    sigmas:
      source.separation_as:
        kind: absolute
        sigma: 2.0e-6
        unit: arcsec
      source.log_flux_total:
        kind: absolute
        sigma: 1.0e-5
        unit: log_flux
      source.contrast:
        kind: fractional
        sigma: 1.0e-5
      optics.plate_scale_as_per_pix:
        kind: fractional
        sigma: 1.0e-5
      optics.primary.zernike_coeffs_nm[*]:
        kind: absolute
        sigma: 0.1
        unit: nm
      optics.secondary.zernike_coeffs_nm[*]:
        kind: absolute
        sigma: 0.1
        unit: nm

  truth_realization:
    enabled: false
  eigenbasis:
    enabled: false
  forecast:
    enabled: false
    plots: false
