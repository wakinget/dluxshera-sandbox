experiment:
  kind: full_fidelity_binary_iterative_smoke
  schema_version: full_fidelity_binary_iterative_smoke.v1
  run_name: full_fidelity_binary_iterative_smoke
  seed: 42
  source_kind: binary_target
  target: ALPHA_CEN
  n_cases: 1
  n_draws: 1
  system_preset: SHERA_FLIGHT_3P_CONV
  detector_overrides:
    layers:
      jitter:
        action: update
        kernel:
          sigma_x: 0.001
          sigma_y: 0.001
          theta_deg: 0.0
          kernel_size: 3
          units: detector_pix
  spectral_model:
    enabled: true
    preserve_flux_parameters: true
    source_seds:
      mode: target
      generic_binary_fallback: alpha_cen
    truth:
      label: truth_smoke_alpha_cen
      n_lambda: 7
      wavelength_min_nm: 450.0
      wavelength_max_nm: 650.0
      components:
        detector_qe:
          enabled: false
        m2_filter_response:
          enabled: false
    inference:
      label: inference_smoke_alpha_cen
      n_lambda: 3
      wavelength_min_nm: 530.0
      wavelength_max_nm: 570.0
      out_of_band_response: zero
      renormalize_weights: true
      components:
        detector_qe:
          mode: same_as_truth
        m2_filter_response:
          mode: same_as_truth
  high_order_wfe:
    enabled: true
    truth:
      enabled: true
      mirrors:
      - primary
      - secondary
      mode: synthetic
      npix: 16
      amplitude_nm_rms: 0.3
      seed: 20260610
      pairing: independent
      remove_low_order_zernikes: true
    inference:
      enabled: true
      mode: knowledge_error
      knowledge_error:
        enabled: true
        amplitude_nm_rms: 0.1
    artifacts:
      write_maps: false
      write_png_quicklooks: false
      write_summary_json: true
    validation:
      require_nonzero_difference_when_enabled: true
  subblocks:
    n_subblocks: 2
    n_frames: 3
    noise: disabled
    phi_ref: truth_when_available
    schur_curvature_method: auto
    max_dense_dim: 40
    schur_damping: 1.0e-08
    exposure_time_s: 0.05
    reference_diagnostics_profile: none
    reference_optimizer_kind: sgd
    reference_base_lr: 0.4
    reference_n_iter: 3
    variance_floor: 1.0
    summary_information_scale: summed_likelihood
    trace_source:
      mode: trajectory
      source:
        kind: airbus_csv
        path: src/dluxshera/data/airbus_data/Thirty_Min_Observation_Window.csv
      window:
        start_s: 60.0
        n_subblocks: 2
    trajectory_processing:
      smear:
        enabled: true
        render:
          mode: metadata_only
          target_layer: smear
    trace_jitter:
      x_sigma_as: 0.001
      y_sigma_as: 0.001
      pa_sigma_deg: 0.0001
  iterative:
    enabled: true
    windows_per_draw: 2
    subblocks_per_window: 1
    update_mode: physical_full
    update_gain: 0.25
    carry_prior_mean_with_reference: true
    update_safety:
      enabled: true
      posterior_sigma_inflation: 10.0
      min_sigma_by_label: null
      max_abs_update_by_label: null
      reject_on_bad_frame_quality: true
      reject_on_nonfinite_posterior: true
  seeding:
    seed_policy: different_jitter_different_noise
    base_seed: 42
  observation_theta:
    source:
      separation_as: true
      log_flux_total: true
      contrast: true
    optics:
      plate_scale_as_per_pix: true
      primary_zernikes:
        enabled: true
        indices:
        - 0
      secondary_zernikes:
        enabled: true
        indices:
        - 0
  prior_draws:
    enabled: true
    n_cases: 1
    center: truth
    distribution: normal
    draw_seed: 12345
    case_name_template: full_fidelity_smoke_draw_{draw_index:03d}
    sigmas:
      source.separation_as:
        kind: absolute
        sigma: 2.0e-06
        unit: arcsec
      source.log_flux_total:
        kind: absolute
        sigma: 1.0e-05
        unit: log_flux
      source.contrast:
        kind: fractional
        sigma: 1.0e-05
      optics.plate_scale_as_per_pix:
        kind: fractional
        sigma: 1.0e-05
      optics.primary.zernike_coeffs_nm[*]:
        kind: absolute
        sigma: 0.1
        unit: nm
      optics.secondary.zernike_coeffs_nm[*]:
        kind: absolute
        sigma: 0.1
        unit: nm
  truth_realization:
    enabled: false
  eigenbasis:
    enabled: false
  forecast:
    enabled: false
    plots: false
