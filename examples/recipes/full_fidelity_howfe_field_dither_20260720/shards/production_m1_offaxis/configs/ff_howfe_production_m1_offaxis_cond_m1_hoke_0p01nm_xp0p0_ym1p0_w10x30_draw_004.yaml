      metadata:
        campaign_family: full_fidelity_howfe_field_dither_20260720
        ho_ke_active_mirror: primary
        ho_ke_primary_enabled: true
        ho_ke_secondary_enabled: false
        ho_ke_primary_amplitude_nm_rms: 0.01
        ho_ke_secondary_amplitude_nm_rms: 0.0
        field_offset_x_as: 0.0
        field_offset_y_as: -1.0
        field_offset_pa_deg: 0.0
        truth_seed: 20260610
