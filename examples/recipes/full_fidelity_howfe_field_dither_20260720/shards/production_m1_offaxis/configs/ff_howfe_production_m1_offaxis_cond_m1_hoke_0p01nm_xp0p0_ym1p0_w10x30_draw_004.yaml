experiment:
  kind: full_fidelity_binary_iterative
  schema_version: full_fidelity_binary_iterative.v1
  run_name: ff_howfe_production_m1_offaxis_cond_m1_hoke_0p01nm_xp0p0_ym1p0_w10x30_draw_004
  source_kind: binary_target
  target: ALPHA_CEN
  seed: 42
  system_preset: SHERA_FLIGHT_3P_CONV
  seeding:
    seed_policy: different_jitter_different_noise
  detector_overrides:
    layers:
      jitter:
        action: update
        kernel:
          sigma_x: 0.001
          sigma_y: 0.001
          theta_deg: 0.0
          kernel_size: 3
          units: detector_pix
  detector_calibration_knowledge_error:
    enabled: false
  spectral_model:
    enabled: true
    preserve_flux_parameters: true
    photometry_mode: preserve_detected_flux_parameters
    source_seds:
      mode: target
      generic_binary_fallback: alpha_cen
    truth:
      label: truth_full_fidelity_alpha_cen
      mode: effective_source_spectrum
      n_lambda: 3
      wavelength_min_nm: 530.0
      wavelength_max_nm: 570.0
      components:
        detector_qe:
          enabled: true
          path: data/detector_qe/LTN4323_QE.csv
          label: LTN4323_QE_proxy_for_HWK4123
          wavelength_column: Wavelength (nm)
          wavelength_unit: nm
          response_column: QE
          response_unit: dimensionless
          response_scale: 1.0
          detector_model_proxy_for: HWK4123
          assumption: LTN4323 QE curve used as near-term proxy for HWK4123 detector
            QE.
        m2_filter_response:
          enabled: true
          path: data/filter_response/SHERA Notch Filter V2.csv
          label: SHERA_Notch_Filter_V2_reflectance
          wavelength_column: Wavelength (nm)
          wavelength_unit: nm
          response_column: R (%)
          response_unit: percent_reflection
          response_scale: 0.01
    inference:
      label: inference_full_fidelity_alpha_cen
      mode: truncated_effective_source_spectrum
      n_lambda: 3
      wavelength_min_nm: 530.0
      wavelength_max_nm: 570.0
      out_of_band_response: zero
      renormalize_weights: true
      components:
        detector_qe:
          mode: same_as_truth
        m2_filter_response:
          mode: same_as_truth
  high_order_wfe:
    enabled: true
    truth:
      enabled: true
      mirrors:
      - primary
      - secondary
      mode: synthetic
      npix: 256
      amplitude_nm_rms: 20.0
      power_law_alpha: 2.5
      seed: 20260610
      pairing: independent
      remove_low_order_zernikes: true
      remove_zernike_modes:
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
      - 10
      - 11
    inference:
      enabled: true
      mode: knowledge_error
      use_truth_common_map: true
      knowledge_error:
        enabled: true
        amplitude_nm_rms: 0.1
        power_law_alpha: same_as_truth
        remove_low_order_zernikes: true
        realization_policy: additive_correlated
        seed: 20260720
        pairing: independent
        mirrors:
          primary:
            enabled: true
            amplitude_nm_rms: 0.01
          secondary:
            enabled: false
            amplitude_nm_rms: 0.0
    artifacts:
      write_maps: true
      write_png_quicklooks: false
      write_summary_json: true
    validation:
      require_nonzero_difference_when_enabled: true
      max_abs_low_order_projection_nm: 0.0001
      fail_on_low_order_projection: true
  subblocks:
    n_frames: 20
    noise:
      enabled: true
      shot_noise: true
      read_noise: true
      dark_current: false
      use_detector_read_noise: true
      read_noise_electrons: null
      use_detector_dark_current: true
      dark_current_e_per_s: null
      variance_floor: 0.5
      write_variance: true
      seed_policy: from_subblock_noise_seed
    use_render_variance: auto
    phi_ref: truth_when_available
    schur_curvature_method: auto
    max_dense_dim: 40
    schur_damping: 1.0e-08
    exposure_time_s: 0.05
    reference_diagnostics_profile: review
    reference_optimizer_kind: sgd
    reference_base_lr: 0.7
    reference_n_iter: 80
    reference_schedule_kind: linear_warmup
    reference_schedule_warmup_steps: 10
    reference_schedule_start_factor: 0.125
    reference_early_stopping_enabled: true
    reference_early_stopping_min_iter: 20
    reference_early_stopping_patience: 10
    summary_information_scale: summed_likelihood
    schur_frame_quality_policy: warn
    schur_frame_quality_missing: allow_all
    schur_frame_mask_denominator: original
    trace_source:
      mode: trajectory
      source:
        kind: csv
        format: airbus_xyz_arcsec
        path: src/dluxshera/data/airbus_data/Thirty_Min_Observation_Window.csv
      processing:
        filter:
          enabled: true
          kind: high_pass
          method: bessel
          order: 4
          cutoff_period_s: 10.0
          zero_phase: true
          apply_stage: before_window
          columns:
          - source.x_position_as
          - source.y_position_as
          - source.position_angle_deg
        offsets:
          source.x_position_as: 0.0
          source.y_position_as: -1.0
          source.position_angle_deg: 0.0
      window:
        start_s: 0.0
      sampling:
        interpolation: linear
    trajectory_processing:
      smear:
        enabled: true
        edge_policy: symmetric_linear_extrapolate
        max_extrapolation_s: auto
        render:
          mode: subblock_constant_layer
          target_layer: smear
          require_existing_layer: true
          allow_layer_injection: false
        inference:
          mode: matched_subblock_constant
    trace_jitter:
      enabled: true
      apply_to: downstream_template_override
      x_sigma_as: 0.001
      y_sigma_as: 0.001
      pa_sigma_deg: 0.0001
  iterative:
    enabled: true
    windows_per_draw: 10
    subblocks_per_window: 30
    update_mode: eigen_damped
    update_gain: 0.8
    carry_prior_mean_with_reference: true
    update_safety:
      enabled: true
      posterior_sigma_inflation: 10.0
      min_sigma_by_label: null
      max_abs_update_by_label: null
      reject_on_bad_frame_quality: true
      reject_on_nonfinite_posterior: true
    eigenbasis:
      basis_source: posterior_precision
      gate_source: accumulated_information
      whiten: true
      eig_floor_abs: 0.0
      eig_floor_rel: 0.0
      min_kept_modes: null
      max_kept_modes: null
      damping_mode: information
      damping_value: 1.0
      top_k_contributors: 8
  iterative_forecast:
    enabled: true
    projected_windows: 60
    observation_duration_s: 1800.0
    modes:
    - replicate_information
    - stochastic_score_noise
    stochastic_trials: 128
    seed: 20260623
    forecast_from: realized_windows
    output_prefixes:
    - 10
    - 20
    - 30
    - 60
    plots: true
    actual_windows: 10
    subblocks_per_window: 30
  observation_theta:
    source:
      separation_as: true
      log_flux_total: true
      contrast: true
    optics:
      plate_scale_as_per_pix: true
      primary_zernikes:
        enabled: true
        indices:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
      secondary_zernikes:
        enabled: true
        indices:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
  prior_draws:
    enabled: true
    n_cases: 1
    draws_per_condition: 10
    center: truth
    distribution: normal
    draw_seed: 12345
    case_name_template: '{condition_name}_draw_{draw_index:03d}'
    sigmas:
      source.separation_as:
        kind: absolute
        sigma: 0.0001
        unit: arcsec
      source.log_flux_total:
        kind: absolute
        sigma: 0.0001
        unit: log_flux
      source.contrast:
        kind: fractional
        sigma: 0.0001
      optics.plate_scale_as_per_pix:
        kind: fractional
        sigma: 0.0001
    conditions:
    - condition_name: m1_hoke_0p01nm_xp0p0_ym1p0_w10x30
      sigmas:
        optics.primary.zernike_coeffs_nm[*]:
          kind: absolute
          sigma: 0.01
          unit: nm
        optics.secondary.zernike_coeffs_nm[*]:
          kind: absolute
          sigma: 0.01
