experiment:
  kind: observation_bias_campaign
  seed: 42
  run_name: full_zernike_prior_draw_5cases_5x20_shotnoise
  system_preset: SHERA_FLIGHT_3P

  subblocks:
    n_subblocks: 5
    n_frames: 20
    noise: enabled
    phi_ref: recovered
    exposure_time_s: 0.05
    schur_curvature_method: auto
    max_dense_dim: 40
    schur_damping: 1.0e-8

    trace_jitter:
      x_sigma_as: 1.0e-3
      y_sigma_as: 1.0e-3
      pa_sigma_deg: 1.0e-4

    reference_diagnostics_profile: basic

    schur_frame_quality_policy: mask
    schur_frame_chi2_threshold: 5.0
    schur_frame_quality_missing: allow_all
    schur_frame_mask_denominator: original
    schur_frame_mask_min_good_frames: 1

  seeding:
    seed_policy: different_jitter_different_noise
    base_seed: 42

  case_generation:
    include_implicit_zero_bias: false

  observation_theta:
    source:
      separation_as: true
      log_flux_total: true
      contrast: true
    optics:
      plate_scale_as_per_pix: true
      primary_zernikes:
        enabled: true
        indices: from_system
        include: null
        exclude: []
      secondary_zernikes:
        enabled: true
        indices: from_system
        include: null
        exclude: []

  state_partition:
    observation_theta_keys: from_layout
    local_eliminated_keys:
      - source.x_position_as
      - source.y_position_as
      - source.position_angle_deg
    subblock_shared_active_keys: []
    report_only_keys: []

  bias_cases: []

  prior_draws:
    enabled: true
    n_cases: 5
    center: truth
    distribution: normal
    draw_seed: 12345
    case_name_template: prior_draw_{draw_index:03d}
    sigmas:
      source.separation_as:
        kind: absolute
        sigma: 1.0e-5
        unit: arcsec
      source.log_flux_total:
        kind: absolute
        sigma: 1.0e-5
        unit: log_flux
      source.contrast:
        kind: fractional
        sigma: 1.0e-5
      optics.plate_scale_as_per_pix:
        kind: fractional
        sigma: 1.0e-5
      optics.primary.zernike_coeffs_nm[*]:
        kind: absolute
        sigma: 1.0e-1
        unit: nm
      optics.secondary.zernike_coeffs_nm[*]:
        kind: absolute
        sigma: 1.0e-1
        unit: nm

  eigenbasis:
    enabled: true
    sources:
      - accumulated_information
      - posterior_precision
    whiten: true
    eig_floor_abs: 0.0
    eig_floor_rel: 1.0e-12
    top_k_contributors: 8

  forecast:
    enabled: true
    modes:
      - replicate
      - fixed_information_score_noise
    n_subblocks_grid: [1, 3, 5, 10, 30, 100, 300, 1000, 1800]
    subblock_duration_s: 1.0
    single_observation_n_subblocks: 1800
    replicate:
      enabled: true
    fixed_information_score_noise:
      enabled: true
      n_trials: 100
      seed: 2026
      score_noise_alpha: 1.0
      score_noise_eig_floor_abs: 0.0
      score_noise_eig_floor_rel: 1.0e-12
      truth_mode: campaign_truth
    plots: true
