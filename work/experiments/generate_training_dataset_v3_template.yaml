system:
  preset: SHERA_FLIGHT_3P_SIMPLE
  source:
    kind: alpha_cen
    target: ALPHA_CEN
    exposure_time_s: 0.05
  optics:
    primary_noll_indices: [4, 5, 6, 7, 8, 9, 10, 11]
    secondary_noll_indices: [4, 5, 6, 7, 8, 9, 10, 11]

experiment:
  kind: ml_training_dataset_v3
  notes: "Fisher-scaled pair-grid ML training dataset template."
  seed: 0

  sweep_keys:
    - source.separation_as
    - source.position_angle_deg
    - source.x_position_as
    - source.y_position_as
    - source.log_flux_total
    - source.contrast
    - optics.plate_scale_as_per_pix
    - optics.primary.zernike_coeffs_nm
    - optics.secondary.zernike_coeffs_nm

  noise:
    enabled: false

  outputs:
    outdir: ../../Results/ML Training Datasets

  sweeps:
    default:
      min_sigma: 1e0
      max_sigma: 1e3
      n_magnitudes: 10
      spacing: log

    source.separation_as:
      min_sigma: 1e0
      max_sigma: 2e4
      n_magnitudes: 11
      spacing: log
    source.position_angle_deg:
      min_sigma: 1e0
      max_sigma: 1e4
      n_magnitudes: 11
      spacing: log
    source.x_position_as:
      min_sigma: 1e0
      max_sigma: 1e5
      n_magnitudes: 11
      spacing: log
    source.y_position_as:
      min_sigma: 1e0
      max_sigma: 1e5
      n_magnitudes: 11
      spacing: log
    source.log_flux_total:
      min_sigma: 1e1
      max_sigma: 1e5
      n_magnitudes: 11
      spacing: log
    source.contrast:
      min_sigma: 1e0
      max_sigma: 1e4
      n_magnitudes: 11
      spacing: log
    optics.plate_scale_as_per_pix:
      min_sigma: 1e1
      max_sigma: 1e5
      n_magnitudes: 11
      spacing: log
    optics.primary.zernike_coeffs_nm:
      min_sigma: 1e1
      max_sigma: 4e5
      n_magnitudes: 11
      spacing: log
    optics.secondary.zernike_coeffs_nm:
      min_sigma: 1e1
      max_sigma: 1e5
      n_magnitudes: 11
      spacing: log
