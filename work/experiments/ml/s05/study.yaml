study_id: S05
title: Architecture / Representation Study

dataset:
  artifact_id: PREP-V3-v1
  prepared_dataset_hash: 4cdc325fbf8d4a0e07195ab075bea6f5035dfc01c9990cac03ee1f59c131e5e6

split_registry:
  artifact_id: SPLIT-ML-v1
  content_sha256: 29f0e95c3819cbeb5ce00aafb593445510723ea5fc20e2e7f3e585c1b9615314

pair_policies:
  s01_clean_same_pair_grid_v1:
    family_weights:
      same_nuisance_different_science: 1.0
    same_pair_id: true
    min_fisher_distance: 0.0
    max_fisher_distance: 5000.0
    include_reverse: true
    max_sampling_attempts: 4000

evaluation_artifacts:
  validation:
    artifact_id: S01-VALIDATION-PAIRS-v1
    content_sha256: 68ccd41a35d286c8b060f291eef6c788a6b0d97c9660868f74e01b2b4feae499
    ordered_pair_count: 2048
    pair_policy_id: s01_clean_same_pair_grid_v1
    split: validation
    seed: 1101
    pairs_per_slice: 512
    eval_slices:
      heldout_science_seen_nuisance:
        science_split: validation
        nuisance_split: train
      heldout_science_heldout_nuisance:
        science_split: validation
        nuisance_split: validation
  test:
    artifact_id: S01-TEST-PAIRS-v1
    content_sha256: 375451064bd363a6afb33c6f3f1bdff7e92efe1384c1513b3491b42318c87b82
    ordered_pair_count: 4096
    pair_policy_id: s01_clean_same_pair_grid_v1
    split: test
    seed: 1102
    pairs_per_slice: 1024
    eval_slices:
      heldout_science_seen_nuisance:
        science_split: test
        nuisance_split: train
      heldout_science_heldout_nuisance:
        science_split: test
        nuisance_split: test

experiments:
  S05-E01:
    run_id: S05-E01-R001
    seed: 11
    device: cuda:0
    pair_policy_id: s01_clean_same_pair_grid_v1
    validation_artifact: validation
    test_artifact: test
    require_frozen_validation_manifest: true
    evaluate_test: false
    model:
      channels: [16, 32, 64, 128]
      embedding_dim: 128
      encoder_hidden_dim: 256
      head_hidden_dim: 256
      comparator: concat_diff
      normalization: batch
      adaptive_pool_shape: [4, 4]
    image_scaling:
      mode: global_max_abs
      max_samples: 512
    noise:
      enabled: false
      apply_to: observation
    training:
      epochs: 100
      batch_size: 32
      learning_rate: 0.0005
      weight_decay: 0.0001
      optimizer: adamw
      pairs_per_epoch: 8192
      num_workers: 4
      shard_cache_size: 4
      early_stopping:
        enabled: true
        monitor: validation_loss
        min_epochs: 20
        patience: 12
        min_delta_relative: 0.001
    evaluation:
      fisher_distance_bin_edges: [0, 100, 250, 500, 1000, 2000, 5000]
