system:
  preset: SHERA_FLIGHT_3P
  source:
    kind: alpha_cen
    target: ALPHA_CEN
    exposure_time_s: 1800.0
    x_position_as: 0.0
    y_position_as: 0.0
    separation_as: 10.0
    position_angle_deg: 90.0
    contrast: 3.0
  optics:
    primary_noll_indices: [4, 5, 6, 7, 8, 9, 10, 11]
    secondary_noll_indices: [4, 5, 6, 7, 8, 9, 10, 11]
  detector:
    layers:
      - name: downsample
        kind: Downsample
        kernel_size: 3

experiment:
  kind: ml_training_dataset_v2
  notes: "Fisher-scaled one-parameter-at-a-time ML training dataset."
  seed: 0

  sweep_keys:
    - source.separation_as
    - source.position_angle_deg
    - source.x_position_as
    - source.y_position_as
    - source.log_flux_total
    - source.contrast
    - optics.plate_scale_as_per_pix
    - optics.primary.zernike_coeffs_nm
    - optics.secondary.zernike_coeffs_nm

  noise:
    enabled: false

  outputs:
    outdir: ../../Results/ML Training Datasets

  sweeps:
    default:
      min_sigma: 1e0
      max_sigma: 1e3
      n_magnitudes: 10
      spacing: log

    source.separation_as:
      min_sigma: 1e0
      max_sigma: 2e4
      n_magnitudes: 100
      spacing: log
    source.position_angle_deg:
      min_sigma: 1e0
      max_sigma: 1e4
      n_magnitudes: 100
      spacing: log
    source.x_position_as:
      min_sigma: 1e0
      max_sigma: 1e5
      n_magnitudes: 100
      spacing: log
    source.y_position_as:
      min_sigma: 1e0
      max_sigma: 1e5
      n_magnitudes: 100
      spacing: log
    source.log_flux_total:
      min_sigma: 1e1
      max_sigma: 1e5
      n_magnitudes: 100
      spacing: log
    source.contrast:
      min_sigma: 1e0
      max_sigma: 1e4
      n_magnitudes: 100
      spacing: log
    optics.plate_scale_as_per_pix:
      min_sigma: 1e1
      max_sigma: 1e5
      n_magnitudes: 100
      spacing: log
    optics.primary.zernike_coeffs_nm:
      min_sigma: 1e1
      max_sigma: 4e5
      n_magnitudes: 100
      spacing: log
    optics.secondary.zernike_coeffs_nm:
      min_sigma: 1e1
      max_sigma: 1e5
      n_magnitudes: 100
      spacing: log
