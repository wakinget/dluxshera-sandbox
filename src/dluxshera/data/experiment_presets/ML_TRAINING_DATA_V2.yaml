experiment:
  kind: ml_training_dataset_v2
  notes: "Fisher-scaled one-parameter-at-a-time training dataset."
  seed: 0

  sweep_keys:
    - source.separation_as
    - source.position_angle_deg
    - source.x_position_as
    - source.y_position_as
    - source.log_flux_total
    - source.contrast
    - optics.plate_scale_as_per_pix
    - optics.primary.zernike_coeffs_nm
    - optics.secondary.zernike_coeffs_nm

  noise:
    enabled: false

  outputs:
    outdir: null

  # Use this block for non-structural nominal values that should seed the
  # baseline sample and Fisher calculation.
  nominal_values:
    optics.primary.zernike_coeffs_nm: [0, 0, 0, 0, 0, 0, 0, 0]
    optics.secondary.zernike_coeffs_nm: [0, 0, 0, 0, 0, 0, 0, 0]

  sweeps:
    default:
      min_sigma: 1e0
      max_sigma: 1e3
      n_magnitudes: 20
      spacing: log

    source.separation_as:
      min_sigma: 1e0
      max_sigma: 1e4
      n_magnitudes: 20
      spacing: log
    source.position_angle_deg:
      min_sigma: 1e0
      max_sigma: 1e3
      n_magnitudes: 20
      spacing: log
    source.x_position_as:
      min_sigma: 1e0
      max_sigma: 1e4
      n_magnitudes: 20
      spacing: log
    source.y_position_as:
      min_sigma: 1e0
      max_sigma: 1e4
      n_magnitudes: 20
      spacing: log
    source.log_flux_total:
      min_sigma: 1e1
      max_sigma: 1e4
      n_magnitudes: 20
      spacing: log
    source.contrast:
      min_sigma: 1e0
      max_sigma: 1e3
      n_magnitudes: 20
      spacing: log
    optics.plate_scale_as_per_pix:
      min_sigma: 1e1
      max_sigma: 1e4
      n_magnitudes: 20
      spacing: log
    optics.primary.zernike_coeffs_nm:
      min_sigma: 1e1
      max_sigma: 5e4
      n_magnitudes: 20
      spacing: log
    optics.secondary.zernike_coeffs_nm:
      min_sigma: 1e1
      max_sigma: 1e4
      n_magnitudes: 20
      spacing: log
