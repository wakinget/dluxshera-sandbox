experiment:
  kind: inference
  seed: 42
  noise:
    enabled: true
    photon_noise: true
    read_noise: false
    dark_current: false
  init:
    sampling: prior
  optimizer:
    kind: sgd # sgd | adam
    n_iter: 40
    n_iter_fast: 30
    base_lr: 0.5
  infer_keys:
    - source.separation_as
    - source.position_angle_deg
    - source.x_position_as
    - source.y_position_as
    - source.log_flux_total
    - source.contrast
    - optics.plate_scale_as_per_pix
    - optics.primary.zernike_coeffs_nm
    - optics.secondary.zernike_coeffs_nm
  outputs:
    plots: true

  priors:
    source.separation_as:
      dist: Normal
      sigma: 1.0e-4
    source.position_angle_deg:
      dist: Uniform
      sigma: 1.0e-2
    source.x_position_as:
      dist: Normal
      sigma: 1.0e-2
    source.y_position_as:
      dist: Normal
      sigma: 1.0e-2
    source.log_flux_total:
      dist: LogNormal
      sigma: 1.0e-3
    source.contrast:
      dist: LogNormal
      sigma: 1.0e-3
    optics.plate_scale_as_per_pix:
      dist: LogNormal
      sigma: 1.0e-3
    optics.primary.zernike_coeffs_nm:
      dist: Normal
      sigma: 1.0
    optics.secondary.zernike_coeffs_nm:
      dist: Normal
      sigma: 1.0